function closeModal(){ if(window.__deleting) return; setState({modal:null}); }
let __pendingConfirmAction = null;
function askConfirm(message, actionFn){
  __pendingConfirmAction = actionFn;
  setState({modal:{type:'confirm', message}});
}
function runConfirmedAction(){
  const fn = __pendingConfirmAction; __pendingConfirmAction = null;
  window.__deleting = false;
  setState({modal:null});
  if(fn) fn();
}
/* The confirm dialog's Delete button plays the trash-bin animation, and the
   real deletion happens right after the lid closes and the sound plays. */
function runAnimatedDelete(btn){
  if(btn.dataset.running) return;
  btn.dataset.running = '1';
  window.__deleting = true;
  document.querySelectorAll('.ad-cancel').forEach(b=>b.disabled = true);
  btn.classList.add('open');
  setTimeout(()=>btn.classList.add('shake'), 250);
  setTimeout(()=>btn.classList.add('entering'), 550);
  setTimeout(()=>{ btn.classList.remove('open'); btn.classList.add('close'); }, 1550);
  setTimeout(()=>{ playChime('deleted'); btn.classList.add('success'); }, 2050);
  setTimeout(()=> runConfirmedAction(), 2450);
}
function animDeleteButton(){
  return `<button type="button" class="anim-del" onclick="runAnimatedDelete(this)"><span class="ad-trash"><span class="ad-handle"></span><span class="ad-lid"></span><span class="ad-body"></span></span><span class="ad-text">${BL('মুছুন','Delete')}</span></button>`;
}
/* Soft synthesized UI sounds via the browser's built-in Web Audio API —
   no audio files or external libraries, so nothing to fail to load. Always
   wrapped so a blocked/unsupported audio context can never break the
   action it is attached to. */
function playChime(type){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    const ctx = window.__audioCtx || (window.__audioCtx = new AC());
    if(ctx.state === 'suspended') ctx.resume();
    const presets = {
      login:    {notes:[392.00, 523.25, 659.25, 783.99], gap:0.11, len:0.55, vol:0.16},  // warm rising welcome
      success:  {notes:[523.25, 659.25, 783.99],         gap:0.09, len:0.45, vol:0.15},  // bright major triad
      paid:     {notes:[659.25, 830.61, 987.77, 1318.51],gap:0.08, len:0.5,  vol:0.15},  // sparkling "cha-ching"
      download: {notes:[587.33, 880.00],                 gap:0.10, len:0.4,  vol:0.15},  // quick two-note "done"
      soft:     {notes:[698.46],                         gap:0,    len:0.25, vol:0.10},  // gentle tick
      notify:   {notes:[880.00, 1174.66],                gap:0.12, len:0.35, vol:0.12},  // Notification: soft two-tone bell
      alert:    {notes:[523.25, 392.00],                 gap:0.13, len:0.38, vol:0.13},  // Notification (problem): gentle falling pair
      tick:     {notes:[1046.50],                        gap:0,    len:0.09, vol:0.12},  // Countdown: short tick
      go:       {notes:[1046.50, 1318.51, 1567.98],      gap:0.07, len:0.35, vol:0.15},  // Countdown: final "go"
      dlsuccess:{notes:[660, 880],                       gap:0.10, len:0.32, vol:0.20},  // Download finished
      deleted:  {notes:[520, 820],                       gap:0.12, len:0.32, vol:0.22},  // Delete finished
    };
    if(type==='dlclick'){ // Download pressed: short rising blip
      const o = ctx.createOscillator(), g = ctx.createGain(), t0 = ctx.currentTime;
      o.type='sine'; o.frequency.setValueAtTime(330,t0); o.frequency.exponentialRampToValueAtTime(500,t0+0.08);
      g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.16,t0+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.13);
      o.connect(g); g.connect(ctx.destination); o.start(t0); o.stop(t0+0.14);
      window.__lastChime = Date.now();
      return;
    }
    if(type==='transition'){ // Transition: airy upward whoosh (a quick filtered glide)
      const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
      o.type='triangle'; f.type='lowpass';
      const t0 = ctx.currentTime;
      o.frequency.setValueAtTime(220, t0); o.frequency.exponentialRampToValueAtTime(880, t0+0.22);
      f.frequency.setValueAtTime(500, t0); f.frequency.exponentialRampToValueAtTime(3200, t0+0.22);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.07, t0+0.06); g.gain.exponentialRampToValueAtTime(0.0001, t0+0.28);
      o.connect(f); f.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0+0.32);
      window.__lastChime = Date.now();
      return;
    }
    window.__lastChime = Date.now();
    const p = presets[type] || presets.soft;
    const now = ctx.currentTime;
    p.notes.forEach((freq,i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const t0 = now + i*p.gap;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(p.vol, t0+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+p.len);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t0); osc.stop(t0+p.len+0.05);
    });
  }catch(e){ /* audio unavailable — stay silent, never block the action */ }
}
function toast(message, kind){
  if(Date.now() - (window.__lastChime||0) > 500){ playChime(kind==='error' ? 'alert' : 'notify'); }
  const el = document.createElement('div');
  el.className = 'toast toast-'+(kind||'info');
  el.textContent = message;
  document.body.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(), 300); }, 3200);
}

async function editTeacherPhoto(evt){
  const f = evt.target.files[0]; if(!f) return;
  const data = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(f); });
  state.modal.photo = data;
}

/* One-page single-teacher attendance report, built to fit one printed page.
   Synchronous by design (reads only from already-preloaded cache) so the
   window.print() call stays tied to the click that triggered it. */
/* Builds the inner report block (no outer page wrapper) for one teacher —
   shared by both the single-teacher print and the "all teachers" bulk print. */
function buildTeacherReportBlock(teacherId, y, m){
  const t = (cache.teachers||[]).find(x=>x.id===teacherId);
  if(!t) return '';
  const attAll = cache['attendance:'+y+'-'+m] || {};
  const myAtt = attAll[teacherId] || {};
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const counts = emptyCounts();
  const cell = 'border:1px solid #999;padding:4px 0;text-align:center;';
  let head='', wk='', st='', tm='', anyTime=false, reasons='';
  for(let d=1; d<=daysInMonth; d++){
    const date = new Date(y,m,d);
    const fri = date.getDay()===5;
    const s = myAtt[d];
    if(s && counts[s.status]!==undefined) counts[s.status]++;
    const bg = fri ? 'background:#f6e9b8;' : '';
    head += `<th style="${cell}${bg}font-size:11px;">${d}</th>`;
    wk   += `<td style="${cell}${bg}font-size:9px;color:#666;">${EN_WEEKDAYS[date.getDay()].slice(0,2)}</td>`;
    st   += `<td style="${cell}${bg}font-size:11px;font-weight:700;">${s?stCode(s.status):''}</td>`;
    if(s && s.time) anyTime = true;
    tm   += `<td style="${cell}${bg}font-size:7.5px;color:#444;line-height:1.1;">${s&&s.time?fmtTimeShort(s.time).replace(' ','<br>'):''}</td>`;
    if(s && s.reason) reasons += `<div><b>${d}:</b> ${stCode(s.status)} — ${escHtml(s.reason)}</div>`;
  }
  const th = 'border:1px solid #999;padding:4px;';
  return `
    <div style="max-width:1000px;margin:0 auto;font-family:sans-serif;">
      <div style="text-align:center;margin-bottom:8px;">
        <h2 style="margin:0;">${(cache.settings||{}).siteTitle||''}</h2>
        <div style="font-size:13px;">${new Date(y,m,1).toLocaleString('en-US',{month:'long'})} ${y}</div>
      </div>
      <div style="font-size:12px;line-height:1.7;margin-bottom:10px;">
        <b>Name:</b> ${t.name} &nbsp;&nbsp; <b>Mobile:</b> ${t.mobile} &nbsp;&nbsp; <b>Subject:</b> ${t.subject}
      </div>
      <table style="width:100%;border-collapse:collapse;table-layout:fixed;">
        <tr>${head}</tr>
        <tr>${wk}</tr>
        <tr>${st}</tr>
        ${anyTime?`<tr>${tm}</tr>`:''}
      </table>
      ${reasons? `<div style="margin-top:10px;font-size:11px;line-height:1.6;"><b>Reasons</b>${reasons}</div>`:''}
      <table style="width:100%;border-collapse:collapse;margin-top:16px;font-size:12px;max-width:420px;">
        <tr style="background:#eee;">${ST_ORDER.map(k=>`<th style="${th}">${stCode(k)}</th>`).join('')}</tr>
        <tr style="text-align:center;font-weight:700;">${ST_ORDER.map(k=>`<td style="${th}">${counts[k]}</td>`).join('')}</tr>
      </table>
      <p style="margin-top:16px;font-size:10px;color:#888;text-align:right;">Downloaded on: ${formatReceiptDateTime(Date.now())}</p>
    </div>`;
}
function downloadTeacherAttendancePDF(teacherId, y, m){
  const t = (cache.teachers||[]).find(x=>x.id===teacherId);
  if(!t){ toast(BL_txt('শিক্ষক পাওয়া যায়নি','Teacher not found'), 'error'); return; }
  downloadHtmlAsFile([buildTeacherReportBlock(teacherId, y, m)], `${t.name}-attendance-${y}-${m+1}.html`, `${t.name} — Attendance`);
  toast(BL_txt('ডাউনলোড হয়েছে','Downloaded'));
}
/* Downloads every teacher's individual one-page report together as a single
   file (one teacher per section, each starting on its own page if printed
   later), in one go. */
function downloadAllTeachersAttendancePDF(){
  const teachers = cache.teachers||[];
  const y = state.attYear, m = state.attMonth;
  if(!teachers.length){ toast(BL_txt('কোনো শিক্ষক নেই','No teachers'), 'error'); return false; }
  const blocks = teachers.map(t=>buildTeacherReportBlock(t.id, y, m));
  downloadHtmlAsFile(blocks, `all-teachers-attendance-${y}-${m+1}.html`, 'All Teachers — Attendance');
  toast(BL_txt('ডাউনলোড হয়েছে','Downloaded'));
}

// Swallow any stray runtime error/rejection quietly (no console output —
// this preview surfaces console.* as a blocking overlay) so a one-off glitch
// never freezes every button on the page for the rest of the session.
window.addEventListener('message', (e)=>{
  if(!(e.data && e.data.__customH)) return;
  document.querySelectorAll('.custom-frame').forEach(fr=>{ if(e.source===fr.contentWindow) fr.style.height = e.data.__customH+'px'; });
});
window.addEventListener('error', (e)=>{ e.preventDefault(); });
window.addEventListener('unhandledrejection', (e)=>{ e.preventDefault(); });

boot();
</script>
