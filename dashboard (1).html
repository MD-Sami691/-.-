<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>একাডেমিক ব্যবস্থাপনা ড্যাশবোর্ড</title>
<meta name="theme-color" content="#0b3a36">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Academy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.cdnfonts.com/css/ds-digital" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700&family=Tiro+Bangla&family=Playfair+Display:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --green-900:#0b3a36;
  --green-800:#0f4f49;
  --green-700:#157a6e;
  --green-600:#1f9484;
  --green-100:#e2f3f0;
  --gold:#c4881c;
  --gold-light:#f7e5b8;
  --maroon:#6d2a2a;
  --red:#a1402f;
  --dark-red:#6b2320;
  --blue:#2f4d78;
  --purple:#6a4a7a;
  --bg:#f3f2ec;
  --card:#fffffd;
  --ink:#221e15;
  --muted:#71695a;
  --line:#e3e0d2;
  --radius:22px;
  --radius-sm:13px;
  --shadow:0 10px 28px -16px rgba(34,30,21,.22);
  --shadow-lg:0 30px 70px -24px rgba(11,58,54,.38);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'DM Sans','Anek Bangla',sans-serif;
  background:
    radial-gradient(1100px 560px at 105% -8%, rgba(196,136,28,.11), transparent 62%),
    radial-gradient(900px 480px at -8% 4%, rgba(21,122,110,.11), transparent 60%),
    var(--bg);
  color:var(--ink);
  min-height:100vh;
  letter-spacing:.1px;
}
h1,h2,h3,h4,.disp{font-family:'Playfair Display','Tiro Bangla',serif;font-weight:700;letter-spacing:.2px;}
.eng{font-family:'DM Sans',sans-serif;}
.eyebrow{font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{text-decoration:none;color:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#d9d0b3;border-radius:10px;}

/* ---------- Seal / signature emblem (letterhead crest) ---------- */
.seal{
  width:54px;height:54px;border-radius:50%;
  background:
    repeating-conic-gradient(from 0deg, rgba(255,255,255,.35) 0 3deg, transparent 3deg 12deg),
    radial-gradient(circle at 35% 30%, #d8bc71, var(--gold) 65%, #8a6a20);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(0,0,0,.28), inset 0 0 0 2px rgba(255,255,255,.55);
  flex-shrink:0;position:relative;
}
.seal::after{
  content:"অ";
  width:38px;height:38px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--green-700), var(--green-900));
  color:var(--gold-light);
  display:flex;align-items:center;justify-content:center;
  font-family:'Playfair Display','Tiro Bangla',serif;font-weight:700;
  font-size:18px;
  border:1.5px solid rgba(255,255,255,.4);
}
.seal.sm{width:36px;height:36px;}
.site-logo-img{width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.5);background:#fff;}
.site-logo-img.lg{width:64px;height:64px;margin:0 auto;display:block;}
.seal.sm::after{width:26px;height:26px;font-size:12px;}
.seal.stamp{width:100px;height:100px;opacity:.92;}
.seal.stamp::after{width:78px;height:78px;font-size:30px;}

/* ---------- Top bar ---------- */
.topbar{
  display:flex;align-items:center;gap:14px;
  padding:14px 26px;
  background:linear-gradient(120deg,var(--green-900),var(--green-700));
  color:#fff;
  position:sticky;top:0;z-index:40;
  box-shadow:var(--shadow);
}
.topbar .brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0;}
.topbar .brand h1{font-size:19px;margin:0;line-height:1.25;font-weight:600;}
.topbar .brand small{display:block;color:var(--gold-light);font-weight:500;font-size:11.5px;font-family:'DM Sans',sans-serif;letter-spacing:.3px;}
.topbar .clock{
  text-align:right;background:rgba(255,255,255,.08);
  padding:8px 16px;border-radius:var(--radius-sm);
  border:1px solid rgba(255,255,255,.18);
}
.topbar .clock .time{font-size:18px;font-weight:700;letter-spacing:.5px;}
.topbar .clock .date{font-size:12.5px;color:var(--gold-light);}
.topbar .home-btn{
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);
  color:#fff;padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;
  display:flex;align-items:center;gap:6px;
}
.topbar .home-btn:hover{background:rgba(255,255,255,.22);}
.cloud-badge{
  display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 13px;
  font-size:11.5px;font-weight:600;color:#e9e4d3;white-space:nowrap;
}
.cloud-badge .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px rgba(255,255,255,.12);}
@media(max-width:760px){.cloud-badge{display:none;}}



/* ---------- Digital clock (home banner) ---------- */
.digi-clock{
  width:min(720px,94%);
  background:linear-gradient(110deg,#243f5c 0%,#1b304a 45%,#121f33 100%);
  border-radius:17px;padding:26px 28px 22px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 14px 34px -12px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.10);
}
.dc-row{display:flex;align-items:center;justify-content:center;}
.dc-time{font-family:'DS-Digital','Orbitron','Courier New',monospace;font-size:clamp(50px,9vw,108px);font-weight:400;color:#fff;line-height:.95;letter-spacing:3px;white-space:nowrap;}
.dc-ampm{font-family:'DS-Digital','Orbitron','Courier New',monospace;font-size:clamp(26px,4.4vw,54px);color:#d7d9dd;margin-left:34px;line-height:1;white-space:nowrap;}
.dc-date{margin-top:20px;color:#fff;font-family:'DM Sans','Anek Bangla',Arial,sans-serif;font-size:clamp(14px,2vw,27px);letter-spacing:4px;text-align:center;}
.digi-clock .today-note{margin-top:14px;font-size:12.5px;background:var(--gold);color:var(--green-900);border-radius:999px;padding:4px 14px;display:inline-block;font-weight:700;letter-spacing:0;}
@media(max-width:700px){
  .digi-clock{padding:22px 14px 18px;border-radius:12px;}
  .dc-row{flex-direction:column;gap:12px;}
  .dc-time{font-size:62px;letter-spacing:2px;}
  .dc-ampm{margin-left:0;font-size:34px;}
  .dc-date{margin-top:16px;font-size:14px;letter-spacing:2px;}
}


/* ---------- Animated Delete button (trash bin) ---------- */
.anim-del{width:280px;max-width:100%;height:96px;border:none;border-radius:24px;background:#3c2b73;color:#fff;display:flex;align-items:center;justify-content:center;gap:34px;cursor:pointer;position:relative;
  box-shadow:0 14px 22px rgba(45,35,80,.25),0 5px 10px rgba(45,35,80,.15);transition:transform .2s ease;}
.ad-text{font-size:36px;font-weight:300;line-height:1;white-space:nowrap;position:relative;z-index:2;transition:transform 900ms cubic-bezier(.55,.05,.45,.95),opacity 250ms ease;}
.anim-del.entering .ad-text{transform:translateX(-44px) scale(.25);opacity:0;}
.ad-trash{width:82px;height:100px;position:relative;flex-shrink:0;z-index:5;transform:scale(.55);margin:-22px -19px;}
.ad-body{position:absolute;left:17px;top:30px;width:48px;height:62px;border:5px solid #fff;border-top:none;border-radius:0 0 8px 8px;z-index:2;}
.ad-lid{position:absolute;left:6px;top:18px;width:70px;height:5px;background:#fff;border-radius:10px;transform-origin:58px 50%;z-index:6;transition:transform 500ms cubic-bezier(.2,.8,.2,1);}
.ad-handle{position:absolute;left:31px;top:5px;width:19px;height:11px;border:5px solid #fff;border-bottom:none;border-radius:7px 7px 0 0;transform-origin:10px 10px;z-index:7;transition:transform 500ms cubic-bezier(.2,.8,.2,1);}
.anim-del.open .ad-lid,.anim-del.open .ad-handle{transform:translateY(-10px) rotate(-30deg);}
.anim-del.shake .ad-trash{animation:adShake .45s ease;}
@keyframes adShake{0%{transform:scale(.55) rotate(0)}20%{transform:scale(.55) rotate(-7deg)}40%{transform:scale(.55) rotate(7deg)}60%{transform:scale(.55) rotate(-5deg)}80%{transform:scale(.55) rotate(3deg)}100%{transform:scale(.55) rotate(0)}}
.anim-del.close .ad-lid,.anim-del.close .ad-handle{transform:rotate(0deg);}
.anim-del.success{animation:adPulse .4s ease;}
@keyframes adPulse{0%{transform:scale(1)}50%{transform:scale(1.025)}100%{transform:scale(1)}}

/* ---------- Animated Download button ---------- */
.dl-group{display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
.dl-cap{font-size:12px;font-weight:700;color:var(--muted);}
.dl-btn{position:relative;width:170px;height:43px;border:2px solid #00d9ff;border-radius:30px;background:#303435;color:#fff;cursor:pointer;padding:0;overflow:visible;flex-shrink:0;
  transition:width .55s cubic-bezier(.65,0,.35,1),border-color .3s ease,box-shadow .3s ease;}
.dl-circle{position:absolute;left:-2px;top:-2px;width:43px;height:43px;border-radius:50%;background:#00cfff;display:flex;align-items:center;justify-content:center;
  transition:left .55s cubic-bezier(.65,0,.35,1),transform .55s ease,background .3s ease;}
.dl-icon{width:18px;height:21px;position:relative;}
.dl-icon::before{content:"";position:absolute;left:8px;top:0;width:2px;height:14px;background:#fff;border-radius:3px;}
.dl-icon::after{content:"";position:absolute;left:4px;top:8px;width:8px;height:8px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg);}
.dl-icon span{position:absolute;left:2px;bottom:0;width:15px;height:2px;background:#fff;border-radius:3px;}
.dl-text{position:absolute;left:64px;top:0;width:90px;height:39px;display:flex;align-items:center;justify-content:center;font-size:12.5px;color:#fff;transition:opacity .25s ease,transform .4s ease;}
.dl-btn:active{transform:scale(.97);}
.dl-btn.loading{width:55px;border-color:#00d9ff;box-shadow:0 0 8px rgba(0,217,255,.45),0 0 22px rgba(0,217,255,.18);}
.dl-btn.loading .dl-circle{left:4px;transform:scale(.88);background:#00cfff;}
.dl-btn.loading .dl-text{opacity:0;transform:translateX(-15px);}
.dl-loading{position:absolute;width:22px;height:22px;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);border:2px solid rgba(255,255,255,.9);border-radius:50%;opacity:0;transition:opacity .2s ease,transform .25s ease;}
.dl-btn.loading .dl-loading{opacity:1;transform:translate(-50%,-50%) scale(1);}
.dl-loading::after{content:"";position:absolute;width:6px;height:6px;background:#fff;border-radius:50%;top:-4px;left:7px;transform-origin:4px 15px;animation:dlSpin 1s linear infinite;}
@keyframes dlSpin{to{transform:rotate(360deg);}}
.dl-btn.done{width:132px;border-color:#00ffae;box-shadow:0 0 10px rgba(0,255,174,.5),0 0 25px rgba(0,255,174,.2);animation:dlBounce .45s ease;}
.dl-btn.done .dl-circle{opacity:0;transform:scale(.2);}
.dl-btn.done .dl-text{left:0;width:100%;opacity:1;transform:none;font-weight:600;}
@keyframes dlBounce{0%{transform:scale(1)}45%{transform:scale(1.07)}100%{transform:scale(1)}}
.dl-btn.reset{animation:none;width:170px;border-color:#00d9ff;}
.dl-btn.reset .dl-circle{left:-2px;opacity:1;transform:scale(1);background:#00cfff;}
.dl-btn.reset .dl-text{left:64px;width:90px;opacity:1;transform:none;}

.side-nav .nav-item{position:relative;}
.nav-badge{position:absolute;top:9px;right:10px;background:var(--red);color:#fff;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:800;}
.lr-pill{padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap;}
/* ---------- Admin card punch login ---------- */
.login-method{display:flex;gap:8px;justify-content:center;margin:2px 0 16px;}
.login-method button{border:none;background:var(--green-100);color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:700;font-size:13px;}
.login-method button.active{background:var(--green-700);color:#fff;}
.punch-stage{position:relative;height:250px;margin:4px 0 8px;}
.punch-slot{position:absolute;top:34px;left:50%;transform:translateX(-50%);width:300px;max-width:96%;height:18px;border-radius:10px;background:linear-gradient(#262626,#0a0a0a);box-shadow:inset 0 3px 6px rgba(0,0,0,.75);z-index:3;}
.punch-slot::after{content:"";position:absolute;right:12px;top:6px;width:6px;height:6px;border-radius:50%;background:#3fcb6b;box-shadow:0 0 6px #3fcb6b;}
.admin-card{position:absolute;top:88px;left:50%;margin-left:-130px;width:260px;height:150px;border-radius:16px;z-index:2;cursor:grab;touch-action:none;user-select:none;
  background:linear-gradient(135deg,var(--green-900),var(--green-600));color:#fff;padding:14px 16px;text-align:left;
  box-shadow:0 18px 30px -14px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.18);transition:transform .25s;}
.admin-card:active{cursor:grabbing;}
.admin-card .chip{width:34px;height:26px;border-radius:6px;background:linear-gradient(135deg,#f3dc9a,#c4881c);}
.admin-card .ac-title{position:absolute;top:14px;right:16px;font-size:10px;letter-spacing:2px;font-weight:700;opacity:.85;}
.admin-card .ac-name{margin-top:16px;font-family:'Playfair Display','Tiro Bangla',serif;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.admin-card .ac-site{font-size:10.5px;opacity:.8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.admin-card .ac-bars{position:absolute;left:16px;right:16px;bottom:12px;height:22px;border-radius:3px;opacity:.75;
  background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 4px,#fff 4px 5px,transparent 5px 8px,#fff 8px 11px,transparent 11px 13px);}
.punch-pin{display:none;margin-top:6px;}
.punch-pin input{width:170px;text-align:center;font-size:22px;letter-spacing:8px;padding:10px;border-radius:12px;border:1.5px solid var(--line);}
.punch-count{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:rgba(255,255,255,.92);border-radius:16px;z-index:5;
  font-family:'Playfair Display',serif;font-size:84px;font-weight:800;color:var(--green-700);}
.shake{animation:shake .35s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ---------- Language toggle ---------- */
html[data-lang="bn"] .lang-en{display:none;}
html[data-lang="en"] .lang-bn{display:none;}
html[data-lang="en"] body{font-family:'DM Sans','Anek Bangla',sans-serif;}
html[data-lang="bn"] body{font-family:'Anek Bangla','DM Sans',sans-serif;}
.lang-toggle{display:flex;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:3px;gap:2px;}
.lang-toggle button{border:none;background:transparent;color:#e9e4d3;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;}
.lang-toggle button.active{background:var(--gold);color:var(--green-900);}

/* ---------- Layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:26px 20px 60px;}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;border:1px solid var(--line);}
.section-title{display:flex;align-items:baseline;gap:10px;margin:0 0 18px;font-size:19px;font-weight:600;color:var(--green-900);flex-wrap:wrap;}
.section-title .bar{width:6px;height:22px;border-radius:6px;background:linear-gradient(var(--gold),var(--green-700));}

/* ---------- Banner ---------- */
.banner{
  position:relative;border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow-lg);margin-bottom:22px;
  min-height:260px;display:flex;align-items:flex-end;
  background:linear-gradient(135deg,var(--green-800),var(--green-600));
}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.banner::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg, rgba(3,20,12,.78) 5%, rgba(3,20,12,.15) 60%, rgba(3,20,12,.05));}
.banner-inner{position:relative;z-index:2;width:100%;padding:30px 26px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;}
.banner-inner h2{margin:0;font-size:26px;font-weight:600;}
.banner-inner .sub{color:var(--gold-light);font-size:14px;font-weight:500;margin-top:-8px;}
.banner-datebox{
  background:rgba(255,255,255,.14);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.4);border-radius:var(--radius);
  padding:16px 30px;text-align:center;min-width:230px;
  box-shadow:0 14px 34px -14px rgba(0,0,0,.4);
}
.banner-datebox .big{font-size:22px;font-weight:700;}
.banner-datebox .row2{font-size:13px;color:var(--gold-light);margin-top:2px;}
.banner-datebox .today-note{margin-top:6px;font-size:12.5px;background:var(--gold);color:var(--green-900);border-radius:999px;padding:3px 10px;display:inline-block;font-weight:700;}
.banner-edit{position:absolute;top:14px;right:14px;z-index:3;display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.banner-edit label{background:rgba(255,255,255,.85);color:var(--green-900);padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);}
.btn-url-toggle{background:rgba(255,255,255,.85);color:var(--green-900);border:none;padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:700;box-shadow:var(--shadow);}
.url-box{display:flex;gap:6px;background:#fff;padding:8px;border-radius:12px;box-shadow:var(--shadow-lg);}
.url-box input{border:1.5px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;width:220px;}

/* ---------- Home blocks ---------- */
.block-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
@media(max-width:760px){.block-grid{grid-template-columns:1fr;}}
.panel-block{
  border-radius:var(--radius);padding:30px 26px;color:#fff;position:relative;overflow:hidden;
  min-height:190px;display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:var(--shadow-lg);transition:transform .18s ease, box-shadow .18s ease;
}
.panel-block:hover{transform:translateY(-4px);box-shadow:0 30px 60px -18px rgba(0,0,0,.4);}
.panel-block.teacher{background:linear-gradient(135deg,var(--green-900),var(--green-700) 60%,var(--green-600));}
.panel-block.admin{background:linear-gradient(135deg,var(--maroon),#8a3630 60%,var(--red));}
.panel-block .tag{align-self:flex-start;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.4px;}
.panel-block h3{font-size:24px;margin:14px 0 6px;}
.panel-block p{margin:0;opacity:.9;font-size:14px;}
.panel-block .go{margin-top:16px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;}
.panel-block .deco{position:absolute;right:-30px;bottom:-30px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.09);}

/* ---------- Home widgets grid ---------- */
.home-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin-top:22px;}
@media(max-width:900px){.home-grid{grid-template-columns:1fr;}}
.mini-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px;}
.mini-row:last-child{border-bottom:none;}
.pill{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;}

/* ---------- Buttons ---------- */
.btn{border:none;border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:7px;}
.btn-primary{background:linear-gradient(120deg,var(--green-700),var(--green-600));color:#fff;box-shadow:0 8px 18px -8px rgba(11,110,69,.6);}
.btn-primary:hover{filter:brightness(1.06);}
.btn-gold{background:linear-gradient(120deg,var(--gold),#e2c25a);color:var(--green-900);}
.btn-outline{background:#fff;border:1.5px solid var(--line);color:var(--ink);}
.btn-outline:hover{border-color:var(--green-600);}
.btn-danger{background:linear-gradient(120deg,var(--maroon),var(--red));color:#fff;}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:999px;}
.btn-block{width:100%;justify-content:center;}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;}

/* ---------- Forms ---------- */
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;font-weight:700;color:var(--green-900);margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%;padding:10px 13px;border-radius:var(--radius-sm);border:1.5px solid var(--line);
  font-size:14.5px;background:#fbfbf9;outline:none;transition:border .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green-600);background:#fff;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}
@media(max-width:600px){.form-grid{grid-template-columns:1fr;}}

/* ---------- Login card ---------- */
.login-wrap{display:flex;justify-content:center;padding:50px 16px;}
.login-card{width:420px;max-width:100%;text-align:center;position:relative;padding:34px 30px;border-top:4px solid var(--gold);}
.login-card .seal{margin:0 auto 14px;}
.login-card .eyebrow{color:var(--gold);display:block;margin-bottom:6px;}
.login-card h2{margin:2px 0 2px;color:var(--green-900);font-size:24px;}
.login-card p.sub{color:var(--muted);font-size:13.5px;margin:0 0 22px;}
.login-error{background:#fdecea;color:var(--red);border:1px solid #f5c2bc;border-radius:var(--radius-sm);padding:9px 12px;font-size:13.5px;margin-bottom:12px;}

/* ---------- Toggle switch ---------- */
.switch{position:relative;display:inline-block;width:46px;height:26px;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;cursor:pointer;inset:0;background:#d8ddd4;border-radius:999px;transition:.2s;}
.slider::before{content:"";position:absolute;height:20px;width:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.25);}
input:checked + .slider{background:var(--green-600);}
input:checked + .slider::before{transform:translateX(20px);}

/* ---------- Tabs (admin) ---------- */
.admin-shell{display:grid;grid-template-columns:230px 1fr;gap:20px;}
@media(max-width:860px){.admin-shell{grid-template-columns:1fr;}}
.side-nav{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;height:fit-content;border:1px solid var(--line);position:sticky;top:90px;}
.side-nav .nav-item{display:flex;flex-direction:column;justify-content:center;padding:11px 14px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;color:var(--ink);margin-bottom:5px;transition:background .15s;}
.side-nav .nav-item:hover{background:var(--green-100);}
.side-nav .nav-item.active{background:linear-gradient(120deg,var(--green-700),var(--green-600));color:#fff;}
.side-nav .nav-item .eng{display:block;font-size:10px;opacity:.7;font-weight:500;margin-top:1px;letter-spacing:.3px;}
.side-nav .logout{margin-top:10px;border-top:1px solid var(--line);padding-top:12px;}

/* ---------- Attendance table ---------- */
.att-toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:18px;}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px;}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px;color:#fff;}
.att-table-wrap{overflow:auto;border-radius:var(--radius-sm);border:1px solid var(--line);}
table.att{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px;}
table.att th, table.att td{padding:8px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;white-space:nowrap;}
table.att th{background:var(--green-900);color:#fff;position:sticky;top:0;z-index:2;font-weight:600;}
table.att td.datecell{font-weight:700;background:#fafaf7;position:sticky;left:0;z-index:1;}
table.att tr.friday td.datecell{background:var(--gold-light);color:var(--maroon);}
table.att tr.friday td{background:#fdf7e3;}
.status-chip{display:inline-flex;align-items:center;justify-content:center;min-width:44px;padding:5px 8px;border-radius:999px;font-weight:700;font-size:12.5px;color:#fff;border:none;}
.status-chip.empty{background:#efe9d7;color:#a89f88;}
.status-chip.has-time{flex-direction:column;gap:1px;padding:3px 8px;line-height:1.1;}
.status-chip small{font-size:9px;font-weight:600;opacity:.92;}
.status-chip:hover{filter:brightness(1.08);}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(4,20,12,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal{background:#fff;border-radius:var(--radius);padding:22px;max-width:460px;width:100%;box-shadow:var(--shadow-lg);max-height:90vh;overflow:auto;}
.modal h3{margin:0 0 4px;color:var(--green-900);}
.modal .sub{color:var(--muted);font-size:13px;margin-bottom:14px;}
.status-choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.status-choice{border:2px solid transparent;border-radius:var(--radius-sm);padding:10px 6px;font-weight:800;color:#fff;font-size:13px;text-align:center;}
.status-choice.selected{border-color:var(--green-900);transform:scale(1.04);}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px;}

/* ---------- Toast ---------- */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--green-900);color:#fff;padding:12px 22px;border-radius:999px;
  font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;transition:.25s;z-index:200;
  max-width:90vw;text-align:center;
}
.toast.toast-error{background:var(--dark-red);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- List rows (teachers / holidays / history) ---------- */
.list-row{display:flex;align-items:center;gap:14px;padding:13px 10px;border-bottom:1px solid var(--line);}
.list-row:last-child{border-bottom:none;}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--green-100);color:var(--green-800);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;overflow:hidden;border:2px solid var(--gold-light);}
.avatar img{width:100%;height:100%;object-fit:cover;}
.list-row .info{flex:1;min-width:0;}
.list-row .info h4{margin:0;font-size:15px;}
.list-row .info small{color:var(--muted);font-size:12.5px;}
.list-row .actions{display:flex;gap:8px;}

/* ---------- Routine ---------- */
.routine-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
@media(max-width:800px){.routine-grid{grid-template-columns:repeat(2,1fr);}}
.routine-day{background:#fbfbf9;border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:10px;}
.routine-day.today{background:linear-gradient(160deg,var(--green-100),#fff);border-color:var(--green-600);box-shadow:0 0 0 2px var(--green-600) inset;}
.routine-day h5{margin:0 0 8px;text-align:center;color:var(--green-900);font-size:13.5px;}
.routine-item{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 9px;margin-bottom:6px;font-size:12.5px;}
.routine-item.today-highlight{background:var(--green-600);color:#fff;border-color:var(--green-600);font-weight:700;}
.routine-item .t{color:var(--muted);font-size:11px;}
.routine-item.today-highlight .t{color:var(--gold-light);}

/* ---------- Footer ---------- */
footer{background:linear-gradient(120deg,var(--green-900),#0a2019);color:#e6e9dd;padding:28px 20px;margin-top:44px;text-align:center;font-size:13.5px;}
footer .seal{margin:0 auto 10px;}
footer .edit-footer{margin-top:10px;}
footer textarea{width:100%;max-width:500px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:8px;}

/* ---------- Misc ---------- */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:700px){.grid3{grid-template-columns:1fr 1fr;}}
.stat-box{background:linear-gradient(150deg,#fff,var(--green-100));border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;text-align:center;}
.stat-box .num{font-size:24px;font-weight:800;color:var(--green-900);}
.stat-box .lab{font-size:12px;color:var(--muted);font-weight:700;}
.empty-state{text-align:center;padding:30px 10px;color:var(--muted);}
.tabbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.tabbar button{background:var(--green-100);border:none;border-radius:999px;padding:8px 16px;font-weight:700;font-size:13px;color:var(--ink);}
.tabbar button.active{background:var(--green-700);color:#fff;}
.hidden{display:none !important;}
.rowflex{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.helper{font-size:12px;color:var(--muted);margin-top:4px;}
.today-flag{background:var(--gold);color:var(--green-900);border-radius:999px;padding:2px 10px;font-size:11px;font-weight:800;margin-left:8px;}

/* ---------- Print ---------- */
@media print{
  @page{ size: A4; margin: 10mm; }
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block !important;position:absolute;top:0;left:0;width:100%;padding:0;}
  .no-print{display:none !important;}
}
</style>

/* Normally data lives in the shared cloud storage. If the page is opened on its
   own (for example installed to a phone's home screen from its own address)
   that storage does not exist, so this device's local storage is used instead
   — the app keeps working, but then data stays on that one device. */
const __localShim = {
  async get(k){ const v = localStorage.getItem('sd1:'+k); if(v===null) throw new Error('not found'); return {key:k, value:v}; },
  async set(k,v){ localStorage.setItem('sd1:'+k, v); return {key:k, value:v}; },
  async delete(k){ localStorage.removeItem('sd1:'+k); return {key:k, deleted:true}; },
  async list(prefix){ const keys=[]; for(let i=0;i<localStorage.length;i++){ const n=localStorage.key(i); if(n.indexOf('sd1:')===0 && n.slice(4).indexOf(prefix||'')===0) keys.push(n.slice(4)); } return {keys}; },
};
function store(){ return (window.storage && typeof window.storage.get==='function') ? window.storage : __localShim; }
function usingLocalStore(){ return store()===__localShim; }

async function getData(key, def){
  if(cache[key]!==undefined) return cache[key];
  try{
    const r = await store().get(key, true);
    if(r && r.value!==undefined){ const v = JSON.parse(r.value); cache[key]=v; return v; }
    cache[key]=def; return def;
  }catch(e){ cache[key]=def; return def; }
}
const pendingWrites = {}; // key -> {value, timer} — failed saves get retried in the background
async function setData(key, value, attempt){
  attempt = attempt || 1;
  cache[key]=value;
  cloud.status='saving'; paintCloudBadge();
  try{
    const res = await store().set(key, JSON.stringify(value), true);
    if(!res) throw new Error('empty response from storage');
    delete pendingWrites[key];
    cloud.status = Object.keys(pendingWrites).length ? 'error' : 'connected';
    cloud.lastSync=new Date(); cloud.error=''; paintCloudBadge();
    return true;
  }catch(e){
    // Note: this preview environment surfaces ANY console output (log/warn/
    // error) as a blocking on-page banner that intercepts clicks — so we
    // never call console.* here, we only track state and show a toast.
    cloud.status='error'; cloud.error=(e&&e.message)||'unknown'; paintCloudBadge();
    if(attempt < 3){
      await new Promise(r=>setTimeout(r, attempt*900));
      return setData(key, value, attempt+1);
    }
    // Still failing after 3 tries — keep retrying quietly in the background
    // every few seconds instead of giving up, since these are usually transient.
    pendingWrites[key] = value;
    scheduleBackgroundRetry();
    toast(BL_txt('সংরক্ষণে দেরি হচ্ছে — ব্যাকগ্রাউন্ডে আবার চেষ্টা চলছে','Save delayed — retrying in the background'), 'error');
    return false;
  }
}
let __bgRetryTimer = null;
function scheduleBackgroundRetry(){
  if(__bgRetryTimer) return;
  __bgRetryTimer = setInterval(async ()=>{
    const keys = Object.keys(pendingWrites);
    if(!keys.length){ clearInterval(__bgRetryTimer); __bgRetryTimer=null; return; }
    for(const k of keys){
      try{
        const res = await store().set(k, JSON.stringify(pendingWrites[k]), true);
        if(res){ delete pendingWrites[k]; }
      }catch(e){ /* still failing — leave it queued, try again next tick */ }
    }
    if(!Object.keys(pendingWrites).length){
      cloud.status='connected'; cloud.lastSync=new Date(); paintCloudBadge();
      toast(BL_txt('আগের সংরক্ষণগুলো এখন সম্পন্ন হয়েছে','Earlier saves have now completed'));
    }
  }, 6000);
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* activity log: collected quietly and written in one go shortly after */
const __auditPending = []; let __auditTimer = null;
function auditWho(){ return state.adminAuthed ? 'Admin' : (state.currentTeacher ? state.currentTeacher.name : '—'); }
function auditLog(action, detail, who){
  __auditPending.push({t:Date.now(), w:who||auditWho(), a:action, d:String(detail||'').slice(0,180)});
  clearTimeout(__auditTimer); __auditTimer = setTimeout(flushAudit, 1500);
}
async function flushAudit(){
  if(!__auditPending.length) return;
  const items = __auditPending.splice(0).reverse();
  try{
    const log = await getData('audit_log', []);
    log.unshift(...items);
    await setData('audit_log', log.slice(0,300));

}
/* repeated wrong sign-ins lock further attempts: every 5 misses → 5, 15, then 60 minutes */
async function guardCheck(key){
  const g = await getData(key, {});
  return (g.lockUntil && Date.now() < g.lockUntil) ? Math.ceil((g.lockUntil - Date.now())/1000) : 0;
}
async function guardFail(key, limit){
  const g = Object.assign({fails:0}, await getData(key, {}));
  g.fails = (g.fails||0) + 1;
  if(g.fails % limit === 0){ g.lockUntil = Date.now() + [5,15,60][Math.min(g.fails/limit,3)-1]*60000; }
  await setData(key, g);
  return g;
}
async function guardOk(key){ await setData(key, {fails:0}); }
function lockMsg(sec){
  const m = Math.max(1, Math.ceil(sec/60));
  return BL_txt(`অনেকবার ভুল চেষ্টা হয়েছে — ${toBnAlways(m)} মিনিট পরে আবার চেষ্টা করুন।`, `Too many wrong attempts — try again in ${m} minute(s).`);
}
/* passwords and PINs are stored as salted PBKDF2 hashes, not as readable text */
function canHash(){ return !!(window.crypto && crypto.subtle && window.TextEncoder); }
async function pbkdf2Hex(secret, salt){
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(secret), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:enc.encode(salt), iterations:120000, hash:'SHA-256'}, key, 256);
  return Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function makeSecret(secret){ const salt = uid()+uid(); return {salt, hash: await pbkdf2Hex(secret, salt)}; }
async function checkSecret(secret, rec){ return (await pbkdf2Hex(secret, rec.salt)) === rec.hash; }
async function verifyAdminPassword(pass){
  const s = await getData('settings', DEFAULTS.settings);
  if(s.adminPassRec) return checkSecret(pass, s.adminPassRec);
  const legacy = s.adminPass!==undefined ? s.adminPass : ADMIN.pass;
  if(pass !== legacy) return false;
  if(canHash()){            // first sign-in with a readable password: keep only a hash from now on
    s.adminPassRec = await makeSecret(pass);
    s.adminPassDefault = (pass === ADMIN.pass);
    delete s.adminPass;
    await setData('settings', s);
  }
  return true;
}
function hasCardPin(s){ return !!(s.cardPinRec || s.cardPin); }
function cardPinLength(s){ return s.cardPinLen || (s.cardPin ? String(s.cardPin).length : 0); }
async function verifyCardPin(pin){
  const s = await getData('settings', DEFAULTS.settings);
  if(s.cardPinRec) return checkSecret(pin, s.cardPinRec);
  if(!s.cardPin || pin !== String(s.cardPin)) return false;
  if(canHash()){ s.cardPinRec = await makeSecret(pin); s.cardPinLen = pin.length; delete s.cardPin; await setData('settings', s); }
  return true;
}
function usingDefaultPassword(){
  const s = cache.settings || {};
  return s.adminPassRec ? !!s.adminPassDefault : ((s.adminPass===undefined) || s.adminPass===ADMIN.pass);
}

/* ---------- WhatsApp helpers ---------- */
function waLink(mobile, message){
  let n = (mobile||'').replace(/[^0-9+]/g,'');
  if(n.startsWith('+')) n = n.slice(1);
  else if(n.startsWith('0')) n = '88'+n;          // Bangladeshi local number -> country code 880
  else if(!n.startsWith('880')) n = '88'+n;
  return `https://wa.me/${n}?text=${encodeURIComponent(message)}`;
}
function formatTime12(timeStr){
  if(!timeStr) return '';
  const [hh,mm] = timeStr.split(':').map(Number);
  let h = hh % 12; if(h===0) h = 12;
  const ampm = hh>=12 ? 'PM' : 'AM';
  return `${toBn(h)}:${toBn(String(mm).padStart(2,'0'))} ${ampm}`;
}
/* One combined message per teacher listing every class they have today (start time only) */
function toBnAlways(n){ return String(n).split('').map(c=> /[0-9]/.test(c)? BN_DIGIT[c]:c).join(''); }
/* Always sent in Bangla regardless of the site's current language toggle,
   as requested — the recipients read Bangla regardless of admin's UI language. */
function routineWaMessageForTeacher(siteTitle, teacherEntries, targetDate, dayChoice){
  const dateLine = `${toBnAlways(targetDate.getDate())} ${BN_MONTHS[targetDate.getMonth()]}, ${BN_WEEKDAYS[targetDate.getDay()]}`;
  const dayWord = dayChoice==='tomorrow' ? 'আগামীকাল' : 'আজ';
  const timesList = teacherEntries
    .sort((a,b)=>a.start.localeCompare(b.start))
    .map(r=> bnTimePhrase(r.start))
    .join(', ');
  return `আসসালামু আলাইকুম স্যার,\n\n${dayWord} (${dateLine})\n\nপড়ানোর সময় : ${timesList}`;
}
function bnTimePhrase(timeStr){
  const [hh,mm] = timeStr.split(':').map(Number);
  let h = hh % 12; if(h===0) h = 12;
  const tod = bnTimeOfDay(hh);
  if(mm===0) return `${tod} ${toBnAlways(h)}টা`;
  return `${tod} ${toBnAlways(h)}টা ${toBnAlways(mm)}`;
}
function bnTimeOfDay(hh){
  if(hh < 6) return 'রাত';       // 12am–5:59am
  if(hh < 12) return 'সকাল';     // 6am–11:59am
  if(hh < 16) return 'দুপুর';    // 12pm–3:59pm
  if(hh < 18) return 'বিকাল';    // 4pm–5:59pm
  if(hh < 20) return 'সন্ধ্যা';  // 6pm–7:59pm
  return 'রাত';                  // 8pm onward
}
function formatTime12Bn(timeStr){
  if(!timeStr) return '';
  const [hh,mm] = timeStr.split(':').map(Number);
  let h = hh % 12; if(h===0) h = 12;
  return `${bnTimeOfDay(hh)} ${toBnAlways(h)}:${toBnAlways(String(mm).padStart(2,'0'))}`;
}

/* Renders a bilingual label: both spans are always in the markup,
   CSS (driven by html[data-lang]) shows only the active language. */
function dlButton(fn, args){
  return `<button type="button" class="dl-btn" data-fn="${fn}" data-args="${escHtml(JSON.stringify(args||[]))}" onclick="runDownloadAnim(this)"><span class="dl-circle"><span class="dl-icon"><span></span></span></span><span class="dl-text">${BL('ডাউনলোড','download')}</span><span class="dl-loading"></span></button>`;
}
/* click sound -> spinner -> "done" + success sound -> back to normal.
   The real download starts on the click itself (so browsers allow it). */
function runDownloadAnim(btn){
  if(btn.dataset.busy) return;
  btn.dataset.busy = '1';
  playChime('dlclick');
  btn.classList.add('loading');
  let ok = true;
  try{
    const res = window[btn.dataset.fn].apply(null, JSON.parse(btn.dataset.args||'[]'));
    if(res && typeof res.then==='function') res.then(v=>{ if(v===false) ok = false; }).catch(()=>{ ok = false; });
    else if(res===false) ok = false;
  }catch(e){ ok = false; }
  setTimeout(()=>{
    btn.classList.remove('loading');
    if(!ok){ delete btn.dataset.busy; return; }
    btn.classList.add('done');
    playChime('dlsuccess');
    setTimeout(()=>{
      btn.classList.remove('done'); btn.classList.add('reset');
      setTimeout(()=>{ btn.classList.remove('reset'); delete btn.dataset.busy; }, 550);
    }, 1700);
  }, 2200);
}

  render();                       // instant paint with whatever we already have (no flicker)
  await preloadForCurrentView();  // fetch fresh cloud data for the new month/tab if needed
  render();                       // repaint with confirmed cloud data
}

/* One-time cleanup: earlier versions stored each teacher photo INSIDE the
   single shared 'teachers' record. Once a couple of photos were added,
   that one record could cross the storage size limit — and then EVERY
   future save to it (not just photo saves) started failing. This pulls
   any already-embedded photos out into their own records. */
async function migrateInlinePhotosIfNeeded(){
  try{
    const teachers = await getData('teachers', []);
    let changed = false;
    for(const t of teachers){
      if(t && t.photo){
        await setData('teacher_photo:'+t.id, t.photo);
        delete t.photo;
        changed = true;
      }
    }
    if(changed) await setData('teachers', teachers);
  }catch(e){ /* nothing to migrate */ }
}

function format12Hour(now){
  let h = now.getHours();
  const min = String(now.getMinutes()).padStart(2,'0');
  const sec = String(now.getSeconds()).padStart(2,'0');
  const ampm = h>=12 ? 'PM' : 'AM';
  h = h % 12; if(h===0) h = 12;
  return `${h}:${min}:${sec} ${ampm}`;
}
function tickClock(){
  const els = document.querySelectorAll('.js-clock-time');
  const dels = document.querySelectorAll('.js-clock-date');
  const now = new Date();
  const timeStr = format12Hour(now);
  const dateStr = `${wdName(now.getDay())}, ${now.getDate()} ${moName(now.getMonth())} ${now.getFullYear()}`;
  els.forEach(e=> e.textContent = timeStr);
  dels.forEach(e=> e.textContent = dateStr);
  // big digital clock on the home banner (clock face always uses 0-9 digits, like a real digital display)
  let h = now.getHours();
  const ap = h>=12 ? 'PM' : 'AM';
  h = h%12; if(h===0) h = 12;
  const pad = n=>String(n).padStart(2,'0');
  document.querySelectorAll('.js-dc-time').forEach(e=> e.textContent = `${pad(h)}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`);
  document.querySelectorAll('.js-dc-ampm').forEach(e=> e.textContent = ap);
  const bigDate = state.lang==='en'
    ? `${EN_WEEKDAYS[now.getDay()].slice(0,3)}, ${now.getDate()} ${moName(now.getMonth())} ${now.getFullYear()}`
    : `${wdName(now.getDay())}, ${toBn(now.getDate())} ${moName(now.getMonth())} ${toBn(now.getFullYear())}`;
  document.querySelectorAll('.js-dc-date').forEach(e=> e.textContent = bigDate);
}

/* =========================================================
   HELPERS: holiday-of-today, today's routine
   ========================================================= */
function findTodayHoliday(){
  const holidays = cache.holidays||[];
  const today = new Date(); today.setHours(0,0,0,0);
  return holidays.find(h=>{
    const s = new Date(h.start), e = new Date(h.end);
    s.setHours(0,0,0,0); e.setHours(0,0,0,0);
    return today>=s && today<=e;
  });
}

const CUSTOM_FRAME_SCRIPT = '<scr'+'ipt>(function(){function s(){parent.postMessage({__customH:document.documentElement.scrollHeight},"*");}window.addEventListener("load",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.documentElement);})();</scr'+'ipt>';

async function doTeacherLogin(){
  const name = document.getElementById('tlName').value.trim();
  const mobile = document.getElementById('tlMobile').value.trim();
  const teachers = await getData('teachers', []);
  const wait = await guardCheck('teacher_guard');
  if(wait){ setState({loginError: lockMsg(wait)}); return; }
  const found = teachers.find(t=> t.name.trim().toLowerCase()===name.toLowerCase() && t.mobile.trim()===mobile);
  if(!found){
    await guardFail('teacher_guard', 8);
    auditLog('teacher-login-failed', 'Wrong name or mobile', '—');
    setState({loginError:'নাম বা মোবাইল নম্বর সঠিক নয়। এডমিনের সাথে যোগাযোগ করুন।'}); return;
  }
  await guardOk('teacher_guard');
  auditLog('teacher-login', found.name+' signed in', found.name);
  playChime('login');
  setState({view:'teacherDash', currentTeacher:found, loginError:''});
}

let __cardDrag = null;
function cardDragStart(e){
  const card = document.getElementById('adminCard');
  if(!card || card.dataset.locked) return;
  try{ card.setPointerCapture(e.pointerId); }catch(_){}
  __cardDrag = {startY:e.clientY, dy:0};
  card.style.transition = 'none';
}
function cardDragMove(e){
  if(!__cardDrag) return;
  const card = document.getElementById('adminCard');
  __cardDrag.dy = Math.min(0, e.clientY - __cardDrag.startY);
  card.style.transform = `translateY(${__cardDrag.dy}px)`;
}
function cardDragEnd(){
  if(!__cardDrag) return;
  const card = document.getElementById('adminCard');
  const dy = __cardDrag.dy; __cardDrag = null;
  card.style.transition = 'transform .25s';
  if(dy < -70) cardPunched(); else card.style.transform = 'translateY(0)';
}
function cardPunched(){
  const card = document.getElementById('adminCard');
  if(!card || card.dataset.locked) return;
  const s = cache.settings || DEFAULTS.settings;
  card.style.transition = 'transform .35s'; card.style.transform = 'translateY(-110px)';
  if(!hasCardPin(s)){
    playChime('alert');
    toast(BL_txt('কার্ড পিন সেট করা নেই — পাসওয়ার্ড দিয়ে ঢুকে Settings থেকে সেট করুন','No card PIN is set — log in with the password and set one in Settings'), 'error');
    setTimeout(()=>{ card.style.transform = 'translateY(0)'; }, 500);
    return;
  }
  card.dataset.locked = '1';
  playChime('notify');
  document.getElementById('cardPunchBtn').style.display = 'none';
  const box = document.getElementById('cardPinBox'); box.style.display = 'block';
  setTimeout(()=>{ const i = document.getElementById('cardPinInput'); if(i) i.focus(); }, 150);
}
function cardPinTyped(){
  const s = cache.settings || DEFAULTS.settings;
  const v = document.getElementById('cardPinInput').value;
  const len = cardPinLength(s);
  if(len && v.length === len) checkCardPin();   // auto-enter when the PIN is complete
}
let __pinBusy = false;
async function checkCardPin(){
  if(__pinBusy) return;
  const inp = document.getElementById('cardPinInput');
  if(!inp) return;
  __pinBusy = true;
  try{
    const wait = await guardCheck('login_guard');
    if(wait){ inp.value=''; toast(lockMsg(wait), 'error'); playChime('alert'); return; }
    if(await verifyCardPin(inp.value)){
      await guardOk('login_guard');
      auditLog('login', 'Admin signed in (card + PIN)', 'Admin');
      startCardCountdown();
    }else{
      const g = await guardFail('login_guard', 5);
      auditLog('login-failed', 'Wrong card PIN', '—');
      playChime('alert');
      inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake');
      inp.value = '';
      toast((g.fails % 5 === 0) ? lockMsg(Math.ceil(((g.lockUntil||0)-Date.now())/1000)) : BL_txt('ভুল পিন','Wrong PIN'), 'error');
    }
  } finally { __pinBusy = false; }
}
/* quick 3-2-1 countdown (≈1 second) before the dashboard opens */
function startCardCountdown(){
  const box = document.getElementById('cardCount');
  if(!box) return;
  box.style.display = 'flex';
  let n = 3; box.textContent = n; playChime('tick');
  const iv = setInterval(()=>{
    n--;
    if(n > 0){ box.textContent = n; playChime('tick'); }
    else{
      clearInterval(iv);
      box.textContent = '\u2713'; playChime('go');
      setTimeout(()=>{ setState({view:'adminDash', adminTab:'attendance', loginError:'', adminAuthed:true}); setTimeout(adminLoginHints, 1400); }, 220);
    }
  }, 280);
}
async function doAdminLogin(){
  const id = document.getElementById('aId').value.trim();
  const pass = document.getElementById('aPass').value.trim();
  const wait = await guardCheck('login_guard');
  if(wait){ setState({loginError: lockMsg(wait)}); return; }
  const s = cache.settings || DEFAULTS.settings;
  const realId = s.adminId!==undefined ? s.adminId : ADMIN.id;
  const ok = (id===realId) && await verifyAdminPassword(pass);
  if(ok){
    await guardOk('login_guard');
    auditLog('login', 'Admin signed in (password)', 'Admin');
    playChime('login');
    setState({view:'adminDash', adminTab:'attendance', loginError:'', adminAuthed:true});
    setTimeout(adminLoginHints, 1400);
  }else{
    const g = await guardFail('login_guard', 5);
    auditLog('login-failed', 'Wrong ID or password', '—');
    const left = 5 - (g.fails % 5);
    setState({loginError: (g.fails % 5 === 0)
      ? lockMsg(Math.ceil(((g.lockUntil||0)-Date.now())/1000))
      : BL_txt(`ভুল আইডি বা পাসওয়ার্ড। আর ${toBnAlways(left)} বার ভুল হলে কিছুক্ষণের জন্য লক হবে।`, `Incorrect ID or password. ${left} more wrong attempt(s) will lock sign-in for a while.`)});
  }
}

async function saveStatus(status, reasonOverride){
  // Instant one-click save: clicking any status button calls this directly
  // (carrying along whatever optional reason text is already typed), so
  // assigning a status never needs a separate "Save" click — this is the
  // actual speed fix.
  const {teacherId, day} = state.modal;
  const useStatus = status !== undefined ? status : state.modal.status;
  if(!useStatus) return;
  const useReason = reasonOverride !== undefined ? reasonOverride : state.modal.reason;
  // arrival time is kept only for statuses where it means something; "Late" today fills in the current time
  let useTime = TIME_STATUSES.includes(useStatus) ? (state.modal.time||'') : '';
  { const n = new Date();
    if(useStatus==='LT' && !useTime && state.attYear===n.getFullYear() && state.attMonth===n.getMonth() && day===n.getDate()) useTime = hhmmNow(); }
  const key = 'attendance:'+state.attYear+'-'+state.attMonth;
  const attAll = await getData(key, {});
  if(!attAll[teacherId]) attAll[teacherId] = {};
  attAll[teacherId][day] = { status: useStatus, reason: useReason||'', time: useTime };
  await setData(key, attAll);
  { const tt=(cache.teachers||[]).find(x=>x.id===teacherId); auditLog('attendance', (tt?tt.name:teacherId)+' · '+day+'/'+(state.attMonth+1)+'/'+state.attYear+' → '+stCode(useStatus)+(useTime?' @ '+useTime:'')); }
  setState({modal:null});
}

async function _clearStatus(teacherId, day){
  const key = 'attendance:'+state.attYear+'-'+state.attMonth;
  const attAll = await getData(key, {});
  if(attAll[teacherId]) delete attAll[teacherId][day];
  await setData(key, attAll);
  setState({modal:null});
}

/* Builds one self-contained downloadable HTML report file from one or more
   HTML blocks (one block per printable section) and triggers a direct
   file download via a Blob — no external library, no canvas rendering,
   nothing that depends on a CDN script loading. This always works, and
   the file opens correctly in any browser with Bengali text intact; it
   can still be printed to PDF from there later if ever needed. */
function downloadHtmlAsFile(htmlBlocks, filename, title){
  const blocksHtml = htmlBlocks.map((b,i)=>
    `<div class="report-block"${i>0?' style="page-break-before:always;margin-top:24px;"':''}>${b}</div>`
  ).join('');
  const fullHtml = `<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><title>${title}</title>
<style>
  body{font-family:'Anek Bangla','DM Sans',Arial,sans-serif;padding:20px;color:#111;background:#fff;}
  table{border-collapse:collapse;width:100%;}
  th,td{border:1px solid #999;padding:4px 8px;}
  @page{ size: A4 landscape; margin: 10mm; }
  @media print{ .report-block{page-break-inside:avoid;} }
</style></head>
<body>${blocksHtml}</body></html>`;
  const blob = new Blob([fullHtml], {type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function buildAttendanceGridHtml(y, m){
  const teachers = cache.teachers||[];
  const attAll = cache['attendance:'+y+'-'+m] || {};
  const daysInMonth = new Date(y, m+1, 0).getDate();
  let rows='';
  // Per-teacher status counts, tallied while walking the days — shown as
  // a summary table at the bottom of the sheet.
  const counts = {};
  teachers.forEach(t=>{ counts[t.id] = emptyCounts(); });
  for(let d=1; d<=daysInMonth; d++){
    const date = new Date(y,m,d);

    <table style="border-collapse:collapse;width:100%;font-size:12px;">

function editTeacherOpen(id){
  const t = (cache.teachers||[]).find(x=>x.id===id);
  setState({modal:{type:'editTeacher', id, name:t.name, mobile:t.mobile, subject:t.subject, monthlyFee:t.monthlyFee||'', photo:cache.teacherPhotos ? cache.teacherPhotos[id] : undefined}});
}
async function saveTeacherEdit(){
  const {id,name,mobile,subject,monthlyFee,photo} = state.modal;
  const teachers = await getData('teachers', []);
  const idx = teachers.findIndex(x=>x.id===id);
  if(idx>-1) teachers[idx] = {...teachers[idx], name, mobile, subject, monthlyFee};
  await setData('teachers', teachers);
  // Photo is stored as its own record — this is the actual fix for the
  // "save suddenly starts failing" bug: photos used to live inside the
  // single shared 'teachers' record, so a couple of photos could push
  // that one record past the storage size limit and break EVERY future
  // save to it (not just photo saves). Each photo now has its own record.
  if(photo!==undefined){
    await setData('teacher_photo:'+id, photo);
    if(!cache.teacherPhotos) cache.teacherPhotos = {};
    cache.teacherPhotos[id] = photo;
  }
  auditLog('teacher-edited', name);
  toast('তথ্য হালনাগাদ হয়েছে — Teacher updated');
  setState({modal:null});
}
async function deleteTeacher(id){
  const t = (cache.teachers||[]).find(x=>x.id===id);
  askConfirm(`"${t?t.name:''}" — এই শিক্ষককে সম্পূর্ণভাবে মুছে ফেলা হবে। এই কাজটি ফিরিয়ে নেওয়া যাবে না।`, async ()=>{
    let teachers = await getData('teachers', []);
    teachers = teachers.filter(x=>x.id!==id);
    await setData('teachers', teachers);
    try{ await store().delete('teacher_photo:'+id, true); }catch(e){ /* fine if it never had one */ }
    delete cache['teacher_photo:'+id];
    if(cache.teacherPhotos) delete cache.teacherPhotos[id];
    auditLog('teacher-deleted', t?t.name:id);
    toast('শিক্ষক মুছে ফেলা হয়েছে — Teacher removed');
    render();
  });
}
async function loadTeacherPhotos(){
  const teachers = cache.teachers||[];
  const map = {};
  await Promise.all(teachers.map(async t=>{
    try{ const p = await getData('teacher_photo:'+t.id, ''); if(p) map[t.id] = p; }catch(e){ /* skip a broken one */ }
  }));
  cache.teacherPhotos = map;

}

/* Draws the ticket receipt straight onto a <canvas> (browser built-in, no
   libraries) and returns a PNG blob. */
const receiptBlobCache = {};
function getReceiptBlob(r){
  if(!receiptBlobCache[r.id]) receiptBlobCache[r.id] = drawReceiptBlob(r).catch(()=>null);
  return receiptBlobCache[r.id];
}
function prepareReceiptImage(r){ getReceiptBlob(r); }  // pre-draw so Share/Download are instant
async function drawReceiptBlob(r){
  try{
    if(document.fonts && document.fonts.load){
      await Promise.all([
        document.fonts.load('600 14px "JetBrains Mono"'),
        document.fonts.load('700 20px "JetBrains Mono"'),
        document.fonts.load('14px "Anek Bangla"', r.teacherName+(r.subject||'')),
      ]);
    }
  }catch(e){ /* fall back to system fonts */ }
  const S = 2, W = 420, P = 26, IW = W-2*P;
  const FONT = '"JetBrains Mono","Anek Bangla","Courier New",monospace';
  const isPaid = r.status==='paid';
  const site = ((cache.settings||{}).siteTitle||'').toUpperCase();
  const amountFmt = '\u09F3'+Number(r.amount||0).toLocaleString('en-US');
  const rows1 = [
    ['Receipt No:', '#'+String(r.receiptNo).padStart(6,'0')],
    ['Payment Date:', formatReceiptDateTime(r.createdAt)],
    ['Teacher Name:', r.teacherName],
    ['Mobile:', r.mobile],
    ['Subject:', r.subject||'\u2014'],
  ];
  const rows2 = [
    ['Monthly Fee:', amountFmt],
    ['Paid for '+r.month+':', amountFmt],
    ['Method:', r.method||'Cash'],
    ['Ref/TrxID:', r.trxId||'-'],
    ['Status ('+r.month+'):', isPaid?'Paid':'Due'],
    ['Due:', isPaid?'None':amountFmt],
  ];
  const RH = 30;
  const H = P + 20 + 24 + 18 + 14 + (rows1.length+rows2.length)*RH + 2 + 4 + 2 + 26 + 10 + P;
  const cv = document.createElement('canvas');
  cv.width = W*S; cv.height = H*S;
  const ctx = cv.getContext('2d');
  ctx.scale(S,S);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = '#e4e4e4'; ctx.lineWidth = 1; ctx.strokeRect(0.5,0.5,W-1,H-1);

  // fit a single line of text into maxW by shrinking the font
  const fit = (text, weight, size, maxW, style)=>{
    let s = size;
    while(s>9){ ctx.font = `${style||''} ${weight} ${s}px ${FONT}`; if(ctx.measureText(text).width<=maxW) break; s--; }
    ctx.font = `${style||''} ${weight} ${s}px ${FONT}`;
  };

  // watermark (drawn first, under the text) — wraps and scales so the whole name stays visible
  ctx.save();
  const wmSize = Math.max(15, Math.min(38, Math.round(620/Math.max(site.length,1))));
  ctx.font = `800 ${wmSize}px ${FONT}`;
  const words = site.split(/\s+/).filter(Boolean);
  const lines = []; let cur = '';
  words.forEach(w=>{ const t = cur? cur+' '+w : w; if(ctx.measureText(t).width > IW*0.92 && cur){ lines.push(cur); cur = w; } else cur = t; });
  if(cur) lines.push(cur);
  ctx.translate(W/2, H/2); ctx.rotate(-18*Math.PI/180);
  ctx.fillStyle = isPaid ? 'rgba(15,107,66,0.10)' : 'rgba(140,32,56,0.10)';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const lh = wmSize*1.2;
  lines.forEach((ln,i)=> ctx.fillText(ln, 0, (i-(lines.length-1)/2)*lh));
  ctx.restore();

  const dashed = (y)=>{ ctx.save(); ctx.strokeStyle='#999'; ctx.lineWidth=1; ctx.setLineDash([4,4]); ctx.beginPath(); ctx.moveTo(P,y); ctx.lineTo(W-P,y); ctx.stroke(); ctx.restore(); };
  ctx.fillStyle = '#1a1a1a'; ctx.textBaseline = 'alphabetic';
  let y = P + 20;
  ctx.textAlign = 'center';
  fit(site, 700, 20, IW); ctx.fillText(site, W/2, y);
  y += 24;
  ctx.fillStyle = '#444'; fit('Monthly Fee Payment Receipt', 400, 13.5, IW, 'italic');
  ctx.fillText('Monthly Fee Payment Receipt', W/2, y);
  y += 18; dashed(y); y += 14;
  const drawRows = (rows)=>{
    rows.forEach(([label,value])=>{
      y += 20;
      ctx.fillStyle = '#1a1a1a'; ctx.textAlign = 'left'; ctx.font = `400 14px ${FONT}`;
      ctx.fillText(label, P, y);
      const lw = ctx.measureText(label).width;
      ctx.textAlign = 'right';
      fit(String(value), 600, 14, IW-lw-14);
      ctx.fillText(String(value), W-P, y);
      y += RH-20;
    });
  };
  drawRows(rows1);
  y += 2; dashed(y); y += 4;
  drawRows(rows2);
  y += 2; dashed(y); y += 26;
  ctx.textAlign = 'center'; ctx.fillStyle = '#1a1a1a';
  const thanks = 'Thank you for your service at '+((cache.settings||{}).siteTitle||'')+'!';
  fit(thanks, 400, 13.5, IW, 'italic'); ctx.fillText(thanks, W/2, y);

  return await new Promise(res=> cv.toBlob(b=>res(b), 'image/png'));
}

   share sheet (choose WhatsApp, then the teacher). Where sharing files isn't
   supported, the picture is saved and that teacher's WhatsApp chat is opened
   with nothing typed, ready for the picture to be attached. */
async function sendReceiptWhatsApp(){

/* =========================================================
   BACKUP & RESTORE — everything in one downloadable file
   ========================================================= */
const BACKUP_SKIP = /^(connection_heartbeat|login_guard|teacher_guard|gallery|history)/;   // temporary data / removed features
async function listAllKeys(){
  try{
    const r = await store().list('', true);
    if(r && r.keys && r.keys.length) return r.keys;
  }catch(e){ /* fall back to the known names below */ }
  const keys = Object.keys(DEFAULTS);
  (cache.teachers||[]).forEach(t=>keys.push('teacher_photo:'+t.id));
  const y = new Date().getFullYear();
  for(let yy=y-3; yy<=y+1; yy++) for(let m=0;m<12;m++){ keys.push('attendance:'+yy+'-'+m, 'salary:'+yy+'-'+m); }
  return keys;
}
function backupStamp(){
  const d = new Date(), p = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
}
async function downloadBackup(beforeRestore){
  try{
    const keys = (await listAllKeys()).filter(k=>!BACKUP_SKIP.test(k));
    const data = {};
    for(let i=0;i<keys.length;i+=12){
      await Promise.all(keys.slice(i,i+12).map(async k=>{
        try{ const r = await store().get(k, true); if(r && typeof r.value==='string') data[k] = r.value; }catch(e){ /* key not present */ }
      }));
    }
    const payload = {app:'school-dashboard', version:1, createdAt:Date.now(), site:(cache.settings||{}).siteTitle||'', data};
    const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
    saveBlobAsFile(blob, (beforeRestore===true ? 'before-restore-' : 'backup-')+backupStamp()+'.json');
    if(beforeRestore!==true){
      const s = await getData('settings', DEFAULTS.settings);
      s.lastBackup = Date.now();
      await setData('settings', s);
    }
    auditLog(beforeRestore===true ? 'backup-before-restore' : 'backup', Object.keys(data).length+' items saved to a file');
    toast(BL_txt('ব্যাকআপ ফাইল ডাউনলোড হয়েছে','Backup file downloaded'));
    return true;
  }catch(e){
    toast(BL_txt('ব্যাকআপ নেওয়া যায়নি','Could not create the backup'), 'error');
    return false;
  }
}
function restoreFilePicked(evt){
  const f = evt.target.files && evt.target.files[0];
  evt.target.value = '';
  if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let obj;
    try{ obj = JSON.parse(reader.result); }catch(e){ toast(BL_txt('ফাইলটি পড়া যায়নি — এটি ব্যাকআপ ফাইল নয়','Could not read the file — it is not a backup'), 'error'); return; }
    if(!obj || obj.app!=='school-dashboard' || !obj.data || typeof obj.data!=='object'){
      toast(BL_txt('এটি এই সাইটের ব্যাকআপ ফাইল নয়','This is not a backup file of this site'), 'error'); return;
    }
    const keys = Object.keys(obj.data).filter(k=>/^[A-Za-z0-9_:.\-]{1,200}$/.test(k) && typeof obj.data[k]==='string' && !BACKUP_SKIP.test(k));
    let teacherCount = 0;
    try{ teacherCount = JSON.parse(obj.data.teachers||'[]').length; }catch(e){}
    const months = keys.filter(k=>k.indexOf('attendance:')===0).length;
    setState({modal:{type:'restoreConfirm', payload:obj, keys, teacherCount, months, safety:true}});
  };
  reader.onerror = ()=> toast(BL_txt('ফাইলটি পড়া যায়নি','Could not read the file'), 'error');
  reader.readAsText(f);
}
async function confirmRestore(){
  const m = state.modal;
  if(!m || m.busy) return;
  m.busy = true;
  const btn = document.getElementById('restoreGoBtn'); if(btn){ btn.disabled = true; btn.textContent = '…'; }
  try{
    if(m.safety){ const ok = await downloadBackup(true); if(!ok){ m.busy=false; if(btn){btn.disabled=false; btn.textContent=BL_txt('রিস্টোর করুন','Restore');} return; } }
    for(const k of m.keys){ await store().set(k, m.payload.data[k], true); }
    await reloadAllData();
    auditLog('restore', m.keys.length+' items restored from a backup file', 'Admin');
    playChime('success');
    toast(BL_txt('রিস্টোর সম্পন্ন হয়েছে','Restore complete'));
    setState({modal:null});
  }catch(e){
    m.busy = false;
    toast(BL_txt('রিস্টোর করা যায়নি','Restore failed'), 'error');
    setState({modal:null});
  }
}
async function reloadAllData(){
  Object.keys(cache).forEach(k=>{ delete cache[k]; });
  await Promise.all(Object.keys(DEFAULTS).map(k=>getData(k, DEFAULTS[k])));

function backupAgeText(){
  const s = cache.settings||{};
  if(!s.lastBackup) return null;
  const days = Math.floor((Date.now()-s.lastBackup)/86400000);
  const d = new Date(s.lastBackup).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  return {days, d};
}

function openRejectLeave(id){ setState({modal:{type:'leaveReject', id, note:''}}); }
/* fills "Leave" into attendance for each day of an approved leave, without overwriting anything already marked */
async function markLeaveRange(teacherId, startStr, endStr, reason){
  const s = new Date(startStr+'T00:00:00'), e = new Date(endStr+'T00:00:00');
  const byMonth = {};
  for(let d=new Date(s); d<=e; d.setDate(d.getDate()+1)){
    const k = 'attendance:'+d.getFullYear()+'-'+d.getMonth();
    (byMonth[k] = byMonth[k]||[]).push(d.getDate());
  }
  for(const k of Object.keys(byMonth)){
    const att = await getData(k, {});
    att[teacherId] = att[teacherId] || {};
    byMonth[k].forEach(day=>{ if(!att[teacherId][day]) att[teacherId][day] = {status:'L', reason: String(reason||'').replace(/[<>]/g,''), time:''}; });
    await setData(k, att);
  }
}

  r.status = 'approved'; r.decidedAt = Date.now();

  playChime('success');
  toast(BL_txt('ছুটি মঞ্জুর করা হয়েছে','Leave approved'));

}

/* ----- the teacher's side ----- */
async function submitLeaveRequest(){
  const t = state.currentTeacher; if(!t) return;
  const start = document.getElementById('lrStart').value;
  const end = document.getElementById('lrEnd').value;
  const reason = document.getElementById('lrReason').value.trim().slice(0,300).replace(/[<>]/g,'');
  if(!start || !end){ toast(BL_txt('শুরু ও শেষ তারিখ দিন','Choose the start and end dates'), 'error'); return; }
  if(end < start){ toast(BL_txt('শেষ তারিখ শুরুর আগে হতে পারে না','The end date cannot be before the start date'), 'error'); return; }
  const days = leaveDays(start, end);
  if(days > 60){ toast(BL_txt('একবারে সর্বোচ্চ ৬০ দিন','At most 60 days at a time'), 'error'); return; }
  const limitPast = new Date(); limitPast.setDate(limitPast.getDate()-30);
  if(new Date(start+'T00:00:00') < limitPast){ toast(BL_txt('৩০ দিনের বেশি আগের তারিখের আবেদন করা যায় না','Cannot apply for dates more than 30 days ago'), 'error'); return; }
  if(!reason){ toast(BL_txt('কারণ লিখুন','Please write the reason'), 'error'); return; }
  const list = await getData('leave_requests', []);
  const clash = list.some(r=>r.teacherId===t.id && (r.status==='pending'||r.status==='approved') && !(end < r.start || start > r.end));
  if(clash){ toast(BL_txt('এই সময়ে আপনার আরেকটি আবেদন আছে','You already have a request covering these dates'), 'error'); return; }
  list.push({id:uid(), teacherId:t.id, teacherName:t.name, start, end, reason, status:'pending', note:'', createdAt:Date.now()});
  await setData('leave_requests', list);
  auditLog('leave-request', t.name+' · '+start+' → '+end, t.name);
  playChime('success');
  toast(BL_txt('আবেদন জমা হয়েছে — এডমিনের সিদ্ধান্তের অপেক্ষায়','Request submitted — waiting for the admin'));
  render();
}

async function _cancelLeaveRequest(id){
  const t = state.currentTeacher; if(!t) return;
  const list = await getData('leave_requests', []);
  const r = list.find(x=>x.id===id && x.teacherId===t.id && x.status==='pending');
  if(r){ r.status = 'cancelled'; r.decidedAt = Date.now(); await setData('leave_requests', list); auditLog('leave-withdrawn', t.name+' · '+r.start+' → '+r.end, t.name); }
  render();
}
function teacherSalaryRows(t, y){
  const now = new Date();
  return Array.from({length:12}, (_,m)=>{
    const rec = (cache['salary:'+y+'-'+m]||{})[t.id];
    // Only months the admin actually recorded are shown, plus the current month at the standing monthly
    // fee — older months with no record are not assumed to be "due".
    const isCurrent = (y===now.getFullYear() && m===now.getMonth());
    if(rec && rec.amount!=='' && rec.amount!==undefined) return {m, amount:Number(rec.amount)||0, status:rec.status, paidDate:rec.paidDate};
    if(isCurrent && t.monthlyFee) return {m, amount:Number(t.monthlyFee)||0, status:'due', paidDate:''};
    return null;
  });
}

window.addEventListener('appinstalled', ()=>{ __installEvt = null; toast(BL_txt('অ্যাপ ইনস্টল হয়েছে','App installed')); });
function isStandalone(){ return !!((window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone); }
function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent||''); }
async function makePwaIcons(title){
  const letter = Array.from(title)[0] || 'অ';
  try{ if(document.fonts && document.fonts.load) await document.fonts.load('700 120px "Tiro Bangla"', letter); }catch(e){}
  let logoImg = null;
  const logo = cache.site_logo;
  if(logo && /^data:image/.test(logo)){
    logoImg = await new Promise(res=>{ const im = new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src = logo; });
  }
  const draw = (size)=>{
    const cv = document.createElement('canvas'); cv.width = cv.height = size;
    const x = cv.getContext('2d');
    const g = x.createLinearGradient(0,0,size,size); g.addColorStop(0,'#0b3a36'); g.addColorStop(1,'#1f9484');
    x.fillStyle = g; x.fillRect(0,0,size,size);                        // full-bleed, so it also works as a maskable icon
    x.beginPath(); x.arc(size/2, size/2, size*0.30, 0, Math.PI*2);
    if(logoImg){
      x.save(); x.clip();
      x.drawImage(logoImg, size/2-size*0.30, size/2-size*0.30, size*0.60, size*0.60);
      x.restore();
    }
    x.beginPath(); x.arc(size/2, size/2, size*0.30, 0, Math.PI*2);
    x.lineWidth = size*0.035; x.strokeStyle = '#e8c46a'; x.stroke();
    if(!logoImg){
      x.fillStyle = '#f7e5b8'; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.font = `700 ${Math.round(size*0.36)}px "Tiro Bangla","Playfair Display",serif`;
      x.fillText(letter, size/2, size/2 + size*0.02);
    }
    return cv.toDataURL('image/png');
  };
  return {192: draw(192), 512: draw(512)};
}
function setHeadLink(rel, href, type){
  let el = document.querySelector(`link[rel="${rel}"]`);
  if(!el){ el = document.createElement('link'); el.rel = rel; document.head.appendChild(el); }
  if(type) el.type = type;
  el.href = href;
}
async function setupPwa(){
  try{
    const s = cache.settings || DEFAULTS.settings;
    const title = ((s.siteTitle||'').split('—')[0].trim()) || 'Academy';
    const icons = await makePwaIcons(title);
    const manifest = {
      name: s.siteTitle || title, short_name: title.slice(0,12),
      start_url: location.href.split('#')[0], display: 'standalone', orientation: 'portrait',
      background_color: '#f3f2ec', theme_color: '#0b3a36', lang: 'bn',
      icons: [{src:icons[192], sizes:'192x192', type:'image/png', purpose:'any maskable'},
              {src:icons[512], sizes:'512x512', type:'image/png', purpose:'any maskable'}],
    };
    setHeadLink('manifest', URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'})));
    setHeadLink('apple-touch-icon', icons[192]);
    setHeadLink('icon', icons[192], 'image/png');
    const am = document.querySelector('meta[name="apple-mobile-web-app-title"]'); if(am) am.content = title.slice(0,14);
    // offline support, only when a sw.js file sits next to this page on its own web address
    if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
      try{ const r = await fetch('sw.js', {method:'HEAD', cache:'no-store'}); if(r.ok) navigator.serviceWorker.register('sw.js'); }catch(e){ /* no sw.js here — fine */ }
    }
  }catch(e){ /* the app never depends on this */ }
}
async function installApp(){
  if(__installEvt){
    try{
      __installEvt.prompt();
      const r = await __installEvt.userChoice;
      __installEvt = null;
      if(r && r.outcome==='accepted') playChime('success');
    }catch(e){ setState({modal:{type:'installHelp'}}); }
    return;
  }
  setState({modal:{type:'installHelp'}});
}
function installButton(){
  if(isStandalone()) return '';
  return `<button class="btn btn-outline" onclick="installApp()">📲 ${BL('ফোনে অ্যাপের মতো ইনস্টল করুন','Install as an app')}</button>`;
}

async function saveStatusNames(){
  const out = {}, seen = {};
  for(let i=0;i<ST_ORDER.length;i++){
    const k = ST_ORDER[i];
    const code = document.getElementById('stCode_'+i).value.trim();
    if(!code){ toast(BL_txt('সংক্ষিপ্ত নাম খালি রাখা যাবে না','Short name cannot be empty'), 'error'); return; }
    if(seen[code]){ toast(BL_txt('দুটি স্ট্যাটাসের একই সংক্ষিপ্ত নাম হতে পারে না','Two statuses cannot share the same short name'), 'error'); return; }
    seen[code] = 1;
    out[k] = { code, bn: document.getElementById('stBn_'+i).value.trim() || STATUS_DEFAULTS[k].bn,
               en: document.getElementById('stEn_'+i).value.trim() || STATUS_DEFAULTS[k].en,
               color: document.getElementById('stColor_'+i).value };
  }
  const s = await getData('settings', DEFAULTS.settings);
  s.statusNames = out;
  await setData('settings', s);
  applyStatusNames();
  playChime('success');
  toast(BL_txt('স্ট্যাটাসের নাম সংরক্ষণ হয়েছে','Status names saved'));
  render();
}

async function saveCardPin(){
  const v = document.getElementById('setCardPin').value.trim();

  const s = await getData('settings', DEFAULTS.settings);
  if(canHash()){ s.cardPinRec = await makeSecret(v); s.cardPinLen = v.length; delete s.cardPin; }
  else { s.cardPin = v; delete s.cardPinRec; }
  await setData('settings', s);
  auditLog('card-pin-changed', 'Admin card PIN set');
  playChime('success');
  toast(BL_txt('কার্ড পিন সংরক্ষণ হয়েছে','Card PIN saved'));
  render();
}

async function saveAdminCreds(){
  const id = document.getElementById('setAdminId').value.trim();
  const cur = document.getElementById('setCurPass').value;
  const np = document.getElementById('setNewPass').value;
  const np2 = document.getElementById('setNewPass2').value;
  if(!id){ toast(BL_txt('আইডি দিন','Enter an ID'), 'error'); return; }
  if(!cur){ toast(BL_txt('বর্তমান পাসওয়ার্ড দিন','Enter the current password'), 'error'); return; }
  const wait = await guardCheck('login_guard');
  if(wait){ toast(lockMsg(wait), 'error'); return; }
  if(!(await verifyAdminPassword(cur.trim()))){
    await guardFail('login_guard', 5);
    auditLog('credentials-change-failed', 'Wrong current password');
    toast(BL_txt('বর্তমান পাসওয়ার্ড ভুল','Current password is wrong'), 'error'); return;
  }
  if(np || np2){
    if(np !== np2){ toast(BL_txt('নতুন পাসওয়ার্ড দুটি মেলেনি','The two new passwords do not match'), 'error'); return; }
    if(np.length < 6){ toast(BL_txt('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে','Password needs at least 6 characters'), 'error'); return; }
    if(np === ADMIN.pass){ toast(BL_txt('ডিফল্ট পাসওয়ার্ড ব্যবহার করা যাবে না','The default password cannot be used'), 'error'); return; }
  }
  await guardOk('login_guard');
  const s = await getData('settings', DEFAULTS.settings);
  s.adminId = id;
  if(np){
    if(canHash()){ s.adminPassRec = await makeSecret(np); delete s.adminPass; }
    else { s.adminPass = np; delete s.adminPassRec; }
    s.adminPassDefault = false;
  }
  await setData('settings', s);
  auditLog('credentials-changed', np ? 'Admin ID/password changed' : 'Admin ID changed');
  playChime('success');
  toast(np ? BL_txt('পাসওয়ার্ড বদলানো হয়েছে — পরের বার নতুনটি দিয়ে ঢুকুন','Password changed — use the new one next time') : BL_txt('আইডি হালনাগাদ হয়েছে','ID updated'));
  render();
}

   MODALS
